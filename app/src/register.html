<body class="index-page">

  <!-- Header -->
  <header id="header" class="header sticky-top">
    <div class="branding d-flex align-items-center">
      <div class="container position-relative d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center me-auto">
          <h1 class="sitename">ArogyaBlock</h1>
        </a>
        <nav id="navmenu" class="navmenu">
          <ul>
            <li><a href="./index.html">Login</a></li>
            <li><a href="./register.html" class="active">Register</a></li>
          </ul>
          <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>
      </div>
    </div>
  </header>
  <!-- End Header -->

  <main class="main">

    <!-- Registration Section -->
    <section id="register" class="register section">
      <div class="container" data-aos="fade-up">
        <div class="section-title">
          <h2>Register</h2>
          <p>Please enter your details to register.</p>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-6">

            <!-- Alert Messages -->
            <div class="alert alert-warning" id="warning-alert" style="display: none;">
              <strong>Warning!</strong> Invalid public key. Please enter a valid public key to register.
            </div>

            <div class="alert alert-info" id="info-alert" style="display: none;">
              <strong>Info!</strong> User already registered. Please check your details.
            </div>

            <div class="alert alert-danger" id="error-alert" style="display: none;">
              <strong>Registration failed.</strong> <span id="error-message">Please check your wallet connection and try again.</span>
            </div>

            <div class="alert alert-secondary" id="status-alert" style="display: none;">
              <strong>Status:</strong> <span id="status-message"></span>
            </div>
            <!-- End Alert Messages -->

            <form name="registerForm" class="php-email-form" onsubmit="return addAgent(event);">
              <div class="form-group mt-3">
                <label for="name">Name:</label>
                <input type="text" name="Name" class="form-control" id="name" placeholder="Enter your name" required autofocus>
              </div>
              <div class="form-group mt-3">
                <label for="age">Age:</label>
                <input type="number" name="Age" class="form-control" id="age" placeholder="Enter your age" required>
              </div>
              <div class="form-group mt-3">
                <label for="designation">Registering as:</label>
                <select name="Designation" id="designation" class="form-select" required>
                  <option value="" disabled selected>-- Please Select --</option>
                  <option value="0">Patient</option>
                  <option value="1">Doctor</option>
                </select>
              </div>
              <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary" id="register-button">Register</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </section>
    <!-- End Registration Section -->

  </main>

  <!-- Scroll Top Button -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>

  <!-- Main JS File -->
  <script src="assets/js/main.js"></script>

  <!-- jQuery -->
  <script src="js/jquery.js"></script>

  <!-- Custom JS Files -->
  <script src="js/app.js"></script>
  <script>
    $(document).ready(function() {
      connect().catch(function(error){ console.error(error); });
    });

    function setStatus(message) {
      if (!message) {
        $("#status-alert").hide();
        $("#status-message").text("");
        return;
      }

      $("#status-message").text(message);
      $("#status-alert").show();
    }

    function showRegistrationError(message) {
      $("#error-message").text(message || "Please check your wallet connection and try again.");
      $("#error-alert").show();
    }

    function setSubmitting(isSubmitting) {
      $("#register-button").prop("disabled", isSubmitting);
      $("#register-button").text(isSubmitting ? "Registering..." : "Register");
    }

    function hideMessages() {
      $("#warning-alert").hide();
      $("#info-alert").hide();
      $("#error-alert").hide();
      setStatus("");
    }

    function uploadRegistrationData(ipfsClient, buffer) {
      return new Promise(function(resolve, reject) {
        ipfsClient.files.add(buffer, function(error, result) {
          if (error) {
            reject(error);
            return;
          }

          if (!result || !result[0] || !result[0].hash) {
            reject(new Error("IPFS upload returned no hash"));
            return;
          }

          resolve(result[0].hash);
        });
      });
    }

    function getPatientListAsync() {
      return new Promise(function(resolve, reject) {
        contractInstance.get_patient_list({ gas: 1000000 }, function(error, result) {
          if (error) {
            reject(error);
            return;
          }
          resolve(result || []);
        });
      });
    }

    function getDoctorListAsync() {
      return new Promise(function(resolve, reject) {
        contractInstance.get_doctor_list({ gas: 1000000 }, function(error, result) {
          if (error) {
            reject(error);
            return;
          }
          resolve(result || []);
        });
      });
    }

    function addAgentOnChain(name, age, designation, ipfsHash) {
      return new Promise(function(resolve, reject) {
        contractInstance.add_agent(name, age, designation, ipfsHash, { gas: 1000000 }, function(error, result) {
          if (error) {
            reject(error);
            return;
          }
          resolve(result);
        });
      });
    }

    async function addAgent(event) {
      if (event && event.preventDefault) {
        event.preventDefault();
      }

      hideMessages();
      setSubmitting(true);

      try {
        await connect();
      } catch (error) {
        console.error(error);
        $("#warning-alert").show();
        setSubmitting(false);
        return false;
      }

      const name = $("#name").val();
      const age = $("#age").val();
      let designation = $("#designation").val();
      designation = parseInt(designation);

      let publicKey = (window.ethereum && window.ethereum.selectedAddress) || (web3.eth.accounts && web3.eth.accounts[0]);
      if (!publicKey) {
        $("#warning-alert").show();
        setSubmitting(false);
        return false;
      }
      publicKey = normalizeAddress(publicKey);
      console.log("Public Key:", publicKey);

      try {
        const patientList = await getPatientListAsync();
        const doctorList = await getDoctorListAsync();

        if (addressListIncludes(patientList, publicKey) || addressListIncludes(doctorList, publicKey)) {
          $("#info-alert").show();
          setSubmitting(false);
          return false;
        }

        const userData = `Name: ${name}\nAge: ${age}\nPublic Key: ${publicKey}`;
        let ipfsHash = "";

        if (window.IpfsApi) {
          try {
            setStatus("Saving your profile details to IPFS...");
            const ipfs = window.IpfsApi('localhost', '5001');
            const Buffer = window.IpfsApi().Buffer;
            const buffer = Buffer.from(userData);
            ipfsHash = await uploadRegistrationData(ipfs, buffer);
            console.log("IPFS Hash:", ipfsHash);
          } catch (error) {
            console.warn("IPFS upload failed. Proceeding with on-chain registration only.", error);
            setStatus("IPFS is unavailable, so the app will finish registration without an IPFS profile record.");
          }
        } else {
          setStatus("IPFS library is unavailable, so the app will finish registration without an IPFS profile record.");
        }

        setStatus("Submitting your registration transaction...");
        const transactionHash = await addAgentOnChain(name, age, designation, ipfsHash);
        setStatus("Waiting for blockchain confirmation...");
        await waitForTransactionReceipt(transactionHash);

        if (designation === 0) {
          window.location.href = "./patient.html?key=" + publicKey;
        } else if (designation === 1) {
          window.location.href = "./doctor.html?key=" + publicKey;
        }
      } catch (error) {
        console.error(error);
        showRegistrationError(error.message || "The wallet rejected the transaction or the contract call failed.");
        setSubmitting(false);
      }

      return false; // Prevent form submission
    }
  </script>

</body>

</html>
